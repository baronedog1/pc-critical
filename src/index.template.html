<div id="world" role="img" aria-label="可旋转查看的三维森林树屋医院，六个科室和巡诊小医生"></div>
<header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">＋</span><div><h1>电脑小医院</h1><p>FOREST WELLNESS · 给设备一点温柔</p></div></div><div class="tools"><span class="demo-tag">前端演示</span><select id="scenario" aria-label="切换演示状态"><option value="normal">晴天 · 正常巡诊</option><option value="memory">内存科 · 忙碌中</option><option value="disk">磁盘科 · 空间偏紧</option><option value="cooling">温度科 · 降温中</option></select><button id="pause-motion" aria-pressed="false">暂停动效</button><button id="reset-view">回到全景</button></div></header>
